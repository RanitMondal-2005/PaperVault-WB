{% extends 'base.html' %}
{% block content %}
<div class="container py-5 mt-5">
    <div class="card shadow-lg border-0 rounded-4">
        <!-- Page Header -->
        <div class="card-header bg-primary text-white p-4 rounded-top-4 d-flex justify-content-between align-items-center">
            <h4 class="mb-0 fw-bold"><i class="bi bi-robot me-2"></i>AI Analysis Report</h4>
            <span class="badge bg-light text-primary rounded-pill px-3">Generated for PaperVault WB</span>
        </div>

        <!-- AI Response we recieved via View -->
        <div class="card-body p-4 p-md-5">
            <div class="ai-content">
                <div id="ai-output"></div>
                <!--
                    The AI returns raw Markdown full of symbols (### headers, **bold**, - bullets,\n) which look messy if shown directly.
                    |json_script filter safely stores this Python object(our ai response) inside a hidden JSON script tag (like <script id="ai-raw-result"... >)
                    JavaScript will then read it and use Marked.js to turn those Markdown symbols into clean HTML.
                -->
                {{ result|json_script:"ai-raw-result" }}
            </div>

            <hr class="my-4 border-secondary opacity-25">
            <!-- Action Buttons -->
            <div class="d-flex gap-2">
                <a href="{% url 'ai_lab' %}" class="btn btn-outline-secondary rounded-pill px-4">
                    <i class="bi bi-arrow-left me-1"></i> New Analysis
                </a>
                <!-- Using Browser's Default Print() Function to save as PDF -->
                <button onclick="window.print()" class="btn btn-success rounded-pill px-4">
                    <i class="bi bi-printer me-1"></i> Print / Save PDF
                </button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script>
    document.addEventListener("DOMContentLoaded", function() {

        // 1: Get the div where we want to show the AI result
        let outputDiv = document.getElementById('ai-output');

        // 2. Read the raw AI response text that Django embedded into that pg via json_script tag & JSON.parse extracts the plain text from it
        let rawMarkdown = JSON.parse(document.getElementById('ai-raw-result').textContent);

        // 3: Convert markdown to HTML and inject into the page
        outputDiv.innerHTML = marked.parse(rawMarkdown); // marked.parse() converts marked down response into proper HTML tags
    });
</script>
{% endblock %}
