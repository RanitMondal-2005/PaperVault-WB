{% extends 'base.html' %}
{% block content %}
<div class="container py-5 mt-5">
    <div class="card shadow-lg border-0 rounded-4">
        
        <div class="card-header bg-primary text-white p-4 rounded-top-4 d-flex justify-content-between align-items-center">
            <h4 class="mb-0 fw-bold"><i class="bi bi-robot me-2"></i>AI Analysis Report</h4>
            <span class="badge bg-light text-primary rounded-pill px-3">Generated for PaperVault WB</span>
        </div>
        
        <div class="card-body p-4 p-md-5">
            <div class="ai-content"> 
                <div id="ai-output">
                    {{ result }}
                </div>
            </div>
            
            <hr class="my-4 border-secondary opacity-25">
            
            <div class="d-flex gap-2">
                <a href="{% url 'ai_lab' %}" class="btn btn-outline-secondary rounded-pill px-4">
                    <i class="bi bi-arrow-left me-1"></i> New Analysis
                </a>
                <button onclick="window.print()" class="btn btn-success rounded-pill px-4">
                    <i class="bi bi-printer me-1"></i> Print / Save PDF
                </button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script>
    document.addEventListener("DOMContentLoaded", function() {
        const outputDiv = document.getElementById('ai-output');
        const rawMarkdown = outputDiv.innerText;
        outputDiv.innerHTML = marked.parse(rawMarkdown);
    });
</script>
{% endblock %}
